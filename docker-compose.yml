# Demo only: one container runs the UI, avatar manager, MCP server, and assistant.
# In a real deployment each of those is its own image.
#
# Settings come from the .env file next to this file (copy .env.example).
# Only the variables listed here reach the container.
services:
  avatars:
    build: .
    # A fixed name, so the image from docker/build-image.sh is the one started.
    image: ai-avatars:latest
    ports:
      - "${AVATARS_PORT:-8090}:8080"
    environment:
      # Amdocs AutoX: the user name, the key, and the model. See docs/LLM.md.
      AUTOX_USERNAME: ${AUTOX_USERNAME:-}
      AUTOX_KEY: ${AUTOX_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # The container does not trust the Amdocs certificate authorities that
      # AutoX's certificate is signed by, so it skips that one check. See docs/LLM.md.
      LLM_TLS_VERIFY: ${LLM_TLS_VERIFY:-false}
      # Rarely changed.
      ANSWER_CHECK: ${ANSWER_CHECK:-}
      AUTOX_BASE_URL: ${AUTOX_BASE_URL:-}
      AUTOX_API_VERSION: ${AUTOX_API_VERSION:-}
      AUTOX_APPLICATION: ${AUTOX_APPLICATION:-}
      USERNAME: ${USERNAME:-}
      # Only for running on another provider instead of AutoX.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_USERNAME: ${LLM_USERNAME:-}
    volumes:
      - avatars-data:/data

volumes:
  avatars-data:
