# Demo only: one origin for the UI and both APIs.
server {
  listen 8080;
  server_name _;
  root /app/apps/web/dist;

  # Avatar manager.
  location /v1/avatars {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    error_page 502 503 504 = @avatars_down;
  }

  location = /v1/health {
    proxy_pass http://127.0.0.1:3000;
    error_page 502 503 504 = @avatars_down;
  }

  # Assistant. The answer is a stream, so nothing here may buffer it.
  location /v1/sessions {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    error_page 502 503 504 = @assistant_down;
  }

  location = /v1/assistant {
    proxy_pass http://127.0.0.1:3002;
    error_page 502 503 504 = @assistant_down;
  }

  # Any other API path is an error, not the UI's index page.
  location /v1/ {
    default_type application/problem+json;
    return 404 '{"type":"about:blank","title":"Not found","status":404,"detail":"No API at this path."}';
  }

  # A service that is not running is reported in the APIs' own error format.
  # These apply only when nginx cannot connect; a 502 that a service sends
  # itself passes through unchanged.
  location @avatars_down {
    default_type application/problem+json;
    return 503 '{"type":"about:blank","title":"Service unavailable","status":503,"detail":"The avatar service is not running. Check the container log."}';
  }

  location @assistant_down {
    default_type application/problem+json;
    return 503 '{"type":"about:blank","title":"Service unavailable","status":503,"detail":"The assistant is not running. Check the container log."}';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
